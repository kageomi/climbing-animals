<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#7ec8e3" />
    <title>Huckepack-Seil</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐸</text></svg>" />
  </head>
  <body>
    <canvas id="game"></canvas>

    <div id="hud">
      <span id="height">⬆️ 0m</span>
      <span id="best">🏆 0m</span>
    </div>

    <div id="menu" class="overlay">
      <div class="pair">
        <button class="pick" data-slot="0">🐸</button>
        <span class="rope-icon">〰️</span>
        <button class="pick" data-slot="1">🐵</button>
      </div>
      <button id="start" class="big">▶️</button>
    </div>

    <div id="over" class="overlay hidden">
      <div class="splash">💦</div>
      <div id="over-height" class="score"></div>
      <div class="row">
        <button id="retry" class="big">🚩</button>
        <button id="home" class="big">🏠</button>
      </div>
    </div>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
